project:
  type: website
  output-dir: docs
  render:
    - "404.qmd"
    - "index.qmd"
    - "resources.qmd"
    - "schedule.qmd"
    - "syllabus.qmd"
    - "exercises/*.qmd"
    - "slides/cours_*.qmd"
  resources:
    - "slides/images/"
    - "exercices/*.png"
    - "material/cours_r_partie_1.zip"
    - "material/cours_r_partie_3.zip"
    - "material/cours_r_partie_4.zip"
    - "material/cours_r_partie_6.zip"

# See https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: auto  # Re-render only when source changes

description-meta: "R avancé et introduction à Git"

website:
  title: "R avancé et introduction à Git"
  site-url: "https://dagousket.github.io/r-advanced-git/"
  favicon: "html/seedling-solid-full.svg"

  navbar:
    pinned: true
    background: "#3B8686"
    right:
      - text: "Objectifs"
        file: syllabus.qmd
      - text: "Agenda"
        file: schedule.qmd
      - text: "Ressources"
        file: resources.qmd

  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var author.name >}}]({{< var author.github >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})
format:
  html:
    theme:
      - lumen
      - html/custom.scss
    toc: true
    highlight-style: monokai
